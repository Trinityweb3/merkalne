# ---------------------------------------------------------------------------
# Merklane — production stack
#   app           : Next.js (standalone) on 127.0.0.1:3000, migrations on boot
#   worker        : background bot process (job-feed ingestion + premium dispatch)
#   db            : PostgreSQL 16 with a persistent volume and healthcheck
#   libretranslate: self-hosted machine translation (final fallback for the
#                   LLM provider chain: Groq → DeepSeek → Gemini → LibreTranslate)
#
#   cp .env.example .env  → fill values → docker compose up -d --build
#
# PORT BINDING: the app publishes to 127.0.0.1:3000 ONLY — the reverse proxy
# (Caddy on the VPS terminates TLS on 443) proxies to the loopback port.
# Docker writes its own iptables rules and does NOT go through UFW, so
# binding to the loopback interface (not 0.0.0.0) is the reliable way to
# keep the app off the public internet. If you need direct access without
# a proxy, change to "3000:3000".
# ---------------------------------------------------------------------------

name: merklane

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merklane-app
    restart: unless-stopped
    # External DNS: containers on user-defined networks resolve external
    # names through Docker's embedded DNS (127.0.0.11), which forwards to
    # the host's resolv.conf upstream. On hosts where that upstream is a
    # loopback stub (systemd-resolved 127.0.0.53) or is unreachable from
    # the container namespace, api.resend.com / oauth2.googleapis.com /
    # github.com fail. Pinning public resolvers fixes the DNS path while
    # container-to-container names (db) keep resolving via the embedded
    # DNS. See docker/fix-container-network.sh if connections still fail.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Custom translation glossary (Web3 jargon protection). The app reads
      # it live — edit config/translation-glossary.json on the host and the
      # change applies within 60 s, no container restart. Template:
      # config/translation-glossary.example.json. Delete this mount if you
      # are happy with the built-in default glossary.
      - ./config/translation-glossary.json:/app/config/translation-glossary.json:ro
    environment:
      # Overridden from .env so container networking always resolves.
      DATABASE_URL: postgresql://merklane:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/merklane?schema=public
      DATABASE_PROVIDER: postgresql
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Merklane <noreply@merklane.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      # Bots (webhook routes live in the app process)
      # Notifier bot: premium alert DMs + account linking (worker sends with it)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Admin intake bot: job composer wizard (separate @BotFather bot)
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      TELEGRAM_ADMIN_WEBHOOK_SECRET: ${TELEGRAM_ADMIN_WEBHOOK_SECRET:-}
      # Machine translation of job content. LLM providers are tried in
      # priority order (Groq → DeepSeek → Gemini); the self-hosted
      # LibreTranslate service below is the final fallback. Set a key in
      # .env to activate that provider — e.g. GROQ_API_KEY for the free
      # Groq tier (recommended).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      # Web3 glossary file location inside the container (see the volumes
      # block below — normally you never change this).
      TRANSLATION_GLOSSARY_PATH: ${TRANSLATION_GLOSSARY_PATH:-/app/config/translation-glossary.json}
      NOTIFICATIONS_SUBJECT_PREFIX: ${NOTIFICATIONS_SUBJECT_PREFIX:-[Merklane Jobs]}
      # About-page statistics: anonymous page-view beacon
      TRACKING_ENABLED: ${TRACKING_ENABLED:-true}
      TRACK_DEDUPE_MINUTES: ${TRACK_DEDUPE_MINUTES:-30}
      # Donation wallets shown in the support sheet (empty = hidden)
      DONATION_SOL_ADDRESS: ${DONATION_SOL_ADDRESS:-}
      DONATION_BTC_ADDRESS: ${DONATION_BTC_ADDRESS:-}
      DONATION_USDT_EVM_ADDRESS: ${DONATION_USDT_EVM_ADDRESS:-}
      # Team social links on /about (empty = card renders without a link)
      SOCIAL_VAZIMA_URL: ${SOCIAL_VAZIMA_URL:-}
      SOCIAL_TRINITY_URL: ${SOCIAL_TRINITY_URL:-}
      SOCIAL_GROBOFHIK_URL: ${SOCIAL_GROBOFHIK_URL:-}
      # Merklane Ads: serving switch, top-up confirmation mode (empty = auto:
      # blockbee when BLOCKBEE_API_KEY is set, else manual), deposit-address
      # derivation seed for the manual fallback (see .env.example)
      ADS_ENABLED: ${ADS_ENABLED:-true}
      ADS_TOPUP_MODE: ${ADS_TOPUP_MODE:-}
      ADS_TOPUP_SEED: ${ADS_TOPUP_SEED:-}
      # BlockBee crypto payment processor: hosted deposit addresses for ad
      # top-ups (IPN webhook: /api/webhooks/blockbee) + automated referral
      # payouts. Empty = disabled (manual top-up fallback, withdrawals off).
      BLOCKBEE_API_KEY: ${BLOCKBEE_API_KEY:-}
      BLOCKBEE_IPN_SECRET: ${BLOCKBEE_IPN_SECRET:-}
      BLOCKBEE_COINS: ${BLOCKBEE_COINS:-}
      BLOCKBEE_MIN_PAYOUT_CENTS: ${BLOCKBEE_MIN_PAYOUT_CENTS:-2000}
    depends_on:
      db:
        condition: service_healthy
      # Translation is best-effort: the app serves the English original when
      # LibreTranslate is still booting (it loads Argos models for ~1-2 min) —
      # hence service_started, not service_healthy (a slow translator must
      # never block the site from booting).
      libretranslate:
        condition: service_started
    networks:
      - merklane-net
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # -------------------------------------------------------------------------
  # Background bot worker: ingests external job feeds and dispatches premium
  # job alerts (email / Telegram). Same image as the app, different
  # command. Disable entirely with WORKER_ENABLED=false.
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merklane-worker
    restart: unless-stopped
    # Same DNS rationale as the app service (external feed/alert endpoints).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["bun", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://merklane:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/merklane?schema=public
      DATABASE_PROVIDER: postgresql
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Merklane <noreply@merklane.com>}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_INGEST_INTERVAL_SECONDS: ${WORKER_INGEST_INTERVAL_SECONDS:-300}
      WORKER_DISPATCH_INTERVAL_SECONDS: ${WORKER_DISPATCH_INTERVAL_SECONDS:-60}
      INGEST_FEED_URLS: ${INGEST_FEED_URLS:-}
      AUTO_PUBLISH_INGESTED_JOBS: ${AUTO_PUBLISH_INGESTED_JOBS:-false}
      NOTIFICATION_RETRY_MAX: ${NOTIFICATION_RETRY_MAX:-3}
      NOTIFICATION_EMAIL_CONCURRENCY: ${NOTIFICATION_EMAIL_CONCURRENCY:-4}
      NOTIFICATIONS_SUBJECT_PREFIX: ${NOTIFICATIONS_SUBJECT_PREFIX:-[Merklane Jobs]}
      # About-page statistics: daily snapshot schedule
      STATS_SNAPSHOT_UTC_HOUR: ${STATS_SNAPSHOT_UTC_HOUR:-3}
      STATS_CHECK_INTERVAL_SECONDS: ${STATS_CHECK_INTERVAL_SECONDS:-900}
      STATS_BACKFILL_DAYS: ${STATS_BACKFILL_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - merklane-net
    healthcheck:
      # The worker touches /tmp/worker-heartbeat every 15 s; fail when the
      # file goes stale (hung event loop or crashed loop) for > 2 minutes.
      test: ["CMD", "bun", "-e", "const fs=require('fs');try{const s=fs.statSync('/tmp/worker-heartbeat');process.exit(Date.now()-s.mtimeMs>120000?1:0)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # -------------------------------------------------------------------------
  # Self-hosted machine translation (free, no third-party calls). The app
  # translates job titles/bodies on localized pages (DB-cached per language
  # in Post.translations). Internal service — NOT published to the internet.
  #
  # Memory: ~1.5-2.5 GB with the bundled Argos models on a 2 GB VPS this fits;
  # trim with LT_LOAD_ONLY (e.g. "en,ru,es,pt,uk,de,fr,tr,zh,ar") when RAM is
  # tight. First start downloads nothing (models ship in the image) but takes
  # 1-2 minutes to load them.
  # -------------------------------------------------------------------------
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: merklane-libretranslate
    restart: unless-stopped
    environment:
      # Restrict loaded language pairs (memory). Comment out to load every
      # bundled model. en is the source; listed codes are targets.
      LT_LOAD_ONLY: ${LIBRETRANSLATE_LOAD_ONLY:-en,ru,uk,es,pt,fr,de,tr,zh,ar,hi,id,vi,ko,ja,it,pl,sv}
      # API key OFF by default: the service is unreachable from outside the
      # compose network, so only app/worker can talk to it. Set
      # LIBRETRANSLATE_API_KEY in .env and enable the line below if you ever
      # expose it (e.g. through Caddy on a subdomain).
      # LT_API_KEYS_DB_PATH: /app/db/api_keys.db
      LT_DISABLE_WEB_UI: "1"
    volumes:
      - libretranslate-data:/app/db
    networks:
      - merklane-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: merklane-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: merklane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: merklane
    volumes:
      - merklane-pgdata:/var/lib/postgresql/data
    networks:
      - merklane-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merklane -d merklane"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    # Optional convenience for host-side psql access; remove in hardened
    # deploys. The HOST side defaults to 5433 because a native PostgreSQL
    # very commonly owns 5432 already (docker then fails with
    # "address already in use"). The container-internal port stays 5432 —
    # the app talks to db:5432 over merklane-net and never uses this mapping.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

volumes:
  merklane-pgdata:
  libretranslate-data:

networks:
  merklane-net:
    driver: bridge
